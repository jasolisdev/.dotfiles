# -----------------------------------------------------
# Autostart (ordered for clean session boot)
# -----------------------------------------------------

# 0) Export important session vars so portals, flatpaks, screenshare work
exec-once = dbus-update-activation-environment --systemd --all

# 1) Core security agent
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# 2) Wallpaper engine FIRST (ensures waybar + apps pick correct theme)
exec-once = awww-daemon
exec-once = awww query || awww init
exec-once = ~/.config/hypr/scripts/wallpaper.sh init

# 3) Status bar / tray
# Small delay to avoid race with awww/pywal
exec-once = sleep 0.35 && waybar

# Tray helpers
exec-once = udiskie --no-automount --tray

# 3.5) Notification daemon
exec-once = killall dunst; swaync

# 4) Clipboard history + audio idle lock + idle timer
exec-once = wl-paste --watch cliphist store
exec-once = sway-audio-idle-inhibit
exec-once = swayidle -w timeout 600 'hyprlock' timeout 660 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on'

# 5) Monitor autoswitch profiles (like GNOME's autorandr)
exec-once = kanshi

# 6) Startup sounds (optional flair)
exec-once = paplay $HOME/.config/hypr/sounds/init.wav
exec-once = sleep 1 && paplay --volume 90000 $HOME/.config/hypr/sounds/startup.wav

# 7) Scratchpad terminal (hidden until toggled)
# Start a bit after wallpaper & sounds so session feels smoother
exec-once = kitty --class dropdown -e tmux new-session -A -s 0
# exec-once = sh -c 'sleep 1 && ghostty --config-file=$HOME/.config/ghostty/dropdown-config -e tmux new-session -A -s 0'

# 8) Final compositor tweaks (optional)
exec-once = ~/.bin/scripts/tailscale-auto-get.sh


# Optional cursor apply (remove if already set in env)
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
