# -----------------------------------------------------
# Window rules (Hyprland 0.53+ syntax)
# -----------------------------------------------------

# --- Core app placement (adjust WS numbers to taste) ---
windowrule = workspace 2,  match:class ^(firefox)$
windowrule = workspace 10, match:class ^(Spotify)$
# windowrule = workspace 3,  match:class ^(google-chrome|Chromium)$
# windowrule = workspace 4,  match:class ^(code-oss|code)$

# --- Utilities (float + center + size) ---
# Bluetooth
windowrule = float on, match:class ^(blueman-manager)$
windowrule = size 45% 30%, match:class ^(blueman-manager)$
windowrule = center on, match:class ^(blueman-manager)$

# GNOME Files (Nautilus)
windowrule = float on, match:class ^(org\.gnome\.Nautilus)$
windowrule = size 55% 60%, match:class ^(org\.gnome\.Nautilus)$
windowrule = center on, match:class ^(org\.gnome\.Nautilus)$

# GNOME Calculator, Calendar
windowrule = float on, match:class ^(org\.gnome\.Calculator|org\.gnome\.Calendar)$
windowrule = center on, match:class ^(org\.gnome\.Calculator|org\.gnome\.Calendar)$

# GNOME Disks
windowrule = float on, match:class ^(gnome-disks)$
windowrule = center on, match:class ^(gnome-disks)$

# Pavucontrol (Audio)
windowrule = float on, match:class ^(pavucontrol)$
windowrule = size 60% 50%, match:class ^(pavucontrol)$
windowrule = center on, match:class ^(pavucontrol)$

# cmake-gui
windowrule = float on, match:class ^(cmake-gui)$
windowrule = center on, match:class ^(cmake-gui)$


# --- OBS: keep main window tiled on its workspace; float only dialogs ---
# Put OBS on workspace 8
windowrule = workspace 8, match:class ^(com\.obsproject\.Studio)$
# Float only dialogs/pickers
windowrule = float on, match:class ^(com\.obsproject\.Studio)$, match:title ^(Select Recording Directory|.*Properties.*|.*Filters.*|.*Profile:.*)$
windowrule = center on, match:class ^(com\.obsproject\.Studio)$, match:title ^(Select Recording Directory|.*Properties.*|.*Filters.*|.*Profile:.*)$
windowrule = size 75% 70%, match:class ^(com\.obsproject\.Studio)$, match:title ^(.*Profile:.*)$

# --- File pickers / Portals (covers Chrome/Firefox/GTK/Qt dialogs) ---
windowrule = float on,  match:title ^(Open File|Save File|File Upload|Choose a file|Abrir archivo|Guardar archivo)$
windowrule = center on, match:title ^(Open File|Save File|File Upload|Choose a file|Abrir archivo|Guardar archivo)$
# xdg-desktop-portal-gtk / portal views
windowrule = float on,  match:class ^(org\.freedesktop\.portal\.desktop|xdg-desktop-portal-gtk)$
windowrule = center on, match:class ^(org\.freedesktop\.portal\.desktop|xdg-desktop-portal-gtk)$

# --- Picture-in-Picture (Firefox & Chrome) ---
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = pin on,   match:title ^(Picture-in-Picture)$
windowrule = no_focus on, match:title ^(Picture-in-Picture)$
windowrule = size 480 270, match:title ^(Picture-in-Picture)$

# --- Settings apps (float + center) ---
windowrule = float on,  match:class ^(org\.gnome\.Settings|io\.elementary\.switchboard|qt6ct|qt5ct)$
windowrule = center on, match:class ^(org\.gnome\.Settings|io\.elementary\.switchboard|qt6ct|qt5ct)$

# --- Dropdown / Scratchpad terminal ---
windowrule = float on,                  match:class ^dropdown$
windowrule = workspace special:dropdown, match:class ^dropdown$
windowrule = size 70% 70%,              match:class ^dropdown$
windowrule = center on,                 match:class ^dropdown$

# --- Dropdown / Scratchpad Ghostty (ONLY the special instance) ---
windowrule = float on,                  match:class ^com\.ghostty\.dropdown$
windowrule = workspace special:dropdown, match:class ^com\.ghostty\.dropdown$
windowrule = size 70% 70%,              match:class ^com\.ghostty\.dropdown$
windowrule = center on,                 match:class ^com\.ghostty\.dropdown$
