# -----------------------------------------------------
# Key bindings
# -----------------------------------------------------

$mainMod = SUPER
$SCRIPT  = ~/.bin/hypr

# --- Apps ---
# bind = $mainMod, Return, exec, kitty
bind = $mainMod, Return, exec, kitty
# bind = $mainMod, Return, exec, ghostty
bind = $mainMod, D, exec, pkill wofi || wofi --show drun --normal-window --term=kitty --width=25% --height=47% --columns 1 -I -s ~/.config/wofi/themes/gruvbox-dark.css
# bind = $mainMod Shift, M, exec, pkill wofi || ~/.config/wofi/scripts/powermenu.sh
bind = $mainMod Shift, M, exec, pkill wofi || ~/.config/wofi/powermenu.sh

# --- Window control ---
bind = $mainMod Shift, Q, killactive
bind = $mainMod, F, fullscreen, 0
bind = $mainMod Shift, Space, togglefloating
bind = $mainMod, Space, exec, ~/.config/hypr/scripts/toggleallfloat.sh
bind = $mainMod, P, pseudo
bind = $mainMod, S, togglesplit


# --- Window focus (Vim keys) ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Mouse move/resize with mod
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Resize (arrows & vim-keys) ---
bind = $mainMod Shift, Right, resizeactive, 100 0
bind = $mainMod Shift, Left,  resizeactive, -100 0
bind = $mainMod Shift, Up,    resizeactive, 0 -100
bind = $mainMod Shift, Down,  resizeactive, 0 100

bind = $mainMod Shift, L, resizeactive,  50 0
bind = $mainMod Shift, H, resizeactive, -50 0
bind = $mainMod Shift, K, resizeactive,   0 -50
bind = $mainMod Shift, J, resizeactive,   0 50

# --- Actions / utilities ---
# bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh 
bind = $mainMod, Print, exec, quickshell -c hyprquickshot -n

bind = $mainMod Shift, W, exec, ~/.config/hypr/scripts/wallpaper.sh select
bind = $mainMod Shift, R, exec, killall waybar && waybar


bind = $mainMod Ctrl, Q, exec, wlogout
bind = $mainMod Ctrl, S, exec, kitty --class .config-floating -e ~/.config/hypr/settings/settings.sh
bind = $mainMod, T, exec, ~/.config/hypr/scripts/touchpad.sh
bind = $mainMod Ctrl, H, exec, ~/.config/hypr/scripts/keybindings.sh

# Hypr reload (safe)
bind = $mainMod Ctrl, R, exec, hyprctl reload

# --- Workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod Shift, 1, movetoworkspace, 1
bind = $mainMod Shift, 2, movetoworkspace, 2
bind = $mainMod Shift, 3, movetoworkspace, 3
bind = $mainMod Shift, 4, movetoworkspace, 4
bind = $mainMod Shift, 5, movetoworkspace, 5
bind = $mainMod Shift, 6, movetoworkspace, 6
bind = $mainMod Shift, 7, movetoworkspace, 7
bind = $mainMod Shift, 8, movetoworkspace, 8
bind = $mainMod Shift, 9, movetoworkspace, 9
bind = $mainMod Shift, 0, movetoworkspace, 10

# Cycle workspaces (mouse wheel + TAB)
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1
bind = $mainMod, Tab,        workspace, e+1
bind = $mainMod Shift, Tab,  workspace, e-1
# bind = ALT, Tab, cyclenext

# --- Monitors (focus/move between) ---
bind = $mainMod, period,  focusmonitor, +1
bind = $mainMod, comma,   focusmonitor, -1
bind = $mainMod Shift, period,  movewindow, mon:+1
bind = $mainMod Shift, comma,   movewindow, mon:-1

# --- Scratchpad / special WS ---
bind = $mainMod, I, togglespecialworkspace, dropdown
bind = $mainMod Shift, N, movetoworkspace, special:dropdown

# --- Multimedia / brightness ---
bind = , XF86AudioRaiseVolume, exec, $SCRIPT/volume_brightness.sh volume_up
bind = , XF86AudioLowerVolume, exec, $SCRIPT/volume_brightness.sh volume_down
bind = , XF86AudioMute,        exec, $SCRIPT/volume_brightness.sh volume_mute

bind = , XF86MonBrightnessUp,   exec, $SCRIPT/volume_brightness.sh brightness_up
bind = , XF86MonBrightnessDown, exec, $SCRIPT/volume_brightness.sh brightness_down

bind = , XF86AudioPlayPause, exec, $SCRIPT/volume_brightness.sh play_pause
bind = , XF86AudioPause,     exec, $SCRIPT/volume_brightness.sh play_pause
bind = , XF86AudioPlay,      exec, $SCRIPT/volume_brightness.sh play_pause
bind = , XF86AudioNext,      exec, $SCRIPT/volume_brightness.sh next_track
bind = , XF86AudioPrev,      exec, $SCRIPT/volume_brightness.sh prev_track

# --- Passthrough submap (moved off P to prevent conflict) ---
bind = $mainMod, F12, submap, passthru
submap = passthru
bind = SUPER, Escape, submap, reset
submap = reset
