# -----------------------------------------------------
# NVIDIA / Wayland runtime env
# -----------------------------------------------------

# Force Wayland paths for toolkits
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt5ct

# GBM path for wlroots compositors (Hyprland) on modern NVIDIA
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# VA-API / video decode shim for NVIDIA (used by Firefox / Chrome)
env = LIBVA_DRIVER_NAME,nvidia

# We intentionally DO NOT set WLR_NO_HARDWARE_CURSORS here
# (deprecated). We'll instead use the native cursor block in misc.conf.

# We ALSO do NOT set PRIME offload vars globally.
# If we later confirm you actually need offload, we'll launch specific apps with these instead:
#   __NV_PRIME_RENDER_OFFLOAD=1
#   __VK_LAYER_NV_optimus=NVIDIA_only
#
# That keeps Chrome/Firefox from getting confused.
