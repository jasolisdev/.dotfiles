# -----------------------------------------------------
# Window decoration (updated for new Hyprland syntax)
# -----------------------------------------------------
decoration {
  rounding = 10

  active_opacity   = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  blur {
    enabled        = true
    size           = 6
    passes         = 2
    ignore_opacity = true
    xray           = true
    popups         = true        # replaces old "blurls = waybar"
  }

  shadow {
    enabled      = true          # replaces drop_shadow=true
    range        = 30            # replaces shadow_range
    render_power = 3             # replaces shadow_render_power
    color        = rgba(0,0,0,0.40)   # replaces col.shadow = 0x66000000
  }
}
