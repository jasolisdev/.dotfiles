# -----------------------------------------------------
# General window decoration
# name: "Rounding All Blur No Shadows"
# -----------------------------------------------------

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 12
        passes = 4
        ignore_opacity = true
        xray = true
        popups = true
    }
    active_opacity = 0.9
    inactive_opacity = 0.6
    fullscreen_opacity = 0.9

    shadow {
        enabled = false
        range = 30
        render_power = 3
        color = rgba(0,0,0,0.40)
    }
}
