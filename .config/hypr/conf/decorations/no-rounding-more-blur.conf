# -----------------------------------------------------
# General window decoration
# name: "No Rounding More Blur"
# -----------------------------------------------------

decoration {
    rounding = 0
    blur {
        enabled = true
        size = 12
        passes = 6
        ignore_opacity = true
        xray = true
        popups = true
    }
    active_opacity = 1.0
    inactive_opacity = 0.6
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(0,0,0,0.40)
    }
}
