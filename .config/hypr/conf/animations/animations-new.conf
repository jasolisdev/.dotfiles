
# -----------------------------------------------------
# Animations – with special workspace sliding from bottom
# -----------------------------------------------------
animations {
  enabled = true

  # Curves
  bezier = linear,        0.00, 0.00, 1.00, 1.00
  bezier = smoothInOut,   0.16, 1.00, 0.30, 1.00   # nice for general window anims
  bezier = workspaceSoft, 0.20, 0.10, 0.10, 1.00   # softer workspace slide
  bezier = dropUp,        0.10, 0.90, 0.10, 1.10   # slight overshoot, feels like "rising" up

  # Windows (open/close/move)
  animation = windows,      1, 4.5, smoothInOut
  animation = windowsOut,   1, 4.5, smoothInOut, popin 80%
  animation = windowsMove,  1, 4.0, smoothInOut, slide

  # Borders
  animation = border,       1, 6, linear
  # Comment this if your build doesn’t support borderangle
  animation = borderangle,  1, 24, linear, loop

  # Fades (menus, etc.)
  animation = fade,         1, 5.5, smoothInOut

  # Normal workspaces (slight slide)
  animation = workspaces,   1, 4.0, workspaceSoft, slide

  # 🔥 Special workspaces (like your dropdown scratchpad)
  # slidevert = vertical slide; with this curve it feels like it
  # comes up from the bottom and settles into place.
  animation = specialWorkspace, 1, 4.0, dropUp, slidevert
}
