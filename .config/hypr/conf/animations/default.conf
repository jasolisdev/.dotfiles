# -----------------------------------------------------
# Animations (optimized)
# -----------------------------------------------------
animations {
  enabled = true

  # Smooth curve (snappy but not twitchy)
  bezier = myBezier, 0.05, 0.90, 0.10, 1.05
  bezier = ease,     0.25, 0.10, 0.25, 1.00

  # Windows
  animation = windows,     1, 7, myBezier
  animation = windowsOut,  1, 7, myBezier, popin 80%

  # Borders
  animation = border,      1, 8, ease
  # If your build errors on this, delete the next line:
  animation = borderangle, 1, 8, ease

  # Fades
  animation = fade,        1, 7, ease

  # Workspaces (slightly quicker feels better)
  animation = workspaces,  1, 6, myBezier

  # Optional (enable if supported; harmless if you omit)
  # animation = specialWorkspace, 1, 7, myBezier
}
