# vim:fileencoding=utf-8:ft=conf:foldmethod=marker
###############################################################################
###########################        KITTY CONFIG       ########################
###############################################################################

##############################   Font Settings  ##############################
font_family      JetBrains Mono Bold
font_size        13.5

modify_font cell_height 9px
modify_font cell_width 0px

##############################   Cursor Settings  ############################
cursor                  #cccccc
cursor_text_color        #cccccc
cursor_shape             block
cursor_blink_interval    0.5
# cursor_stop_blinking_after 15.0

##############################   Scrolling Settings  ##########################
# scrollback_lines       10000
# scrollback_pager       less +G -R
# wheel_scroll_multiplier 5.0
# touch_scroll_multiplier 1.0

##############################   Mouse Settings  #############################
url_color               #928374
# url_style             single
# open_url_modifiers    kitty_mod
# open_url_with         default

# copy_on_select        no
# rectangle_select_modifiers ctrl+alt
# select_by_word_characters :@-./_~?&=%+#

# Hide mouse cursor after inactivity (0 disables hiding)
# mouse_hide_wait       0.0

# focus_follows_mouse   no

############################   Window Behavior Settings   #####################
enable_audio_bell        no
# visual_bell_duration   0.0
# window_alert_on_bell   yes
# bell_on_tab           no

window_padding_width     1
active_border_color      #928374
inactive_border_color    #928374
bell_border_color        #ff5a00

# Window resizing steps
# window_resize_step_cells 2
# window_resize_step_lines 2
# window_margin_width      0
# initial_window_width     1900
# initial_window_height    1400

###############################   Tab Bar Settings   ##########################
active_tab_foreground    #000
active_tab_background    #eee
inactive_tab_foreground  #444
inactive_tab_background  #999
# tab_bar_edge           bottom
# tab_bar_margin_width   0
# tab_separator          " ┇"

###############################  Color Scheme  ###############################
include themes/gruvbox-dark.conf

# background_opacity     .95
# dim_opacity            0.8

##########################   Advanced Settings (Optional)   ###################
# shell_integration      no-cursor
# shell .                # Shell program to use (default is user shell)
# close_on_child_death   no
# allow_remote_control   yes
# clipboard_control      write-clipboard write-primary
# term                   xterm-kitty
# sync_to_monitor        yes

