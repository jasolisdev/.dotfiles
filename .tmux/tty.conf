# TTY-specific tmux overrides
# Loaded conditionally when client terminal is "linux" (virtual console)
# Uses base 16 colors only — mapped to gruvbox via TTY palette escape codes

# tmux handles color downsampling to 16 for the TTY client,
# but apps inside tmux make better choices with 256color info
set -g default-terminal "screen-256color"

# No mouse or passthrough in TTY
set -g mouse off
set -g allow-passthrough off

# Remove undercurl overrides (TTY can't render them)
set -as terminal-overrides ""

# --- Gruvbox dark theme (base 16) ---
# colour0  = #282828 bg0         colour8  = #928374 gray
# colour3  = #d79921 yellow      colour11 = #fabd2f bright yellow
# colour7  = #a89984 fg4         colour15 = #ebdbb2 fg1

# Status bar base — explicit bg to override main config
set -g status-style "bg=colour0,fg=colour7"

# Override inherited window styles from main config
set-window-option -g window-status-style "bg=colour0,fg=colour8"
set-window-option -g window-status-current-style "bg=colour0,fg=colour11"
set-window-option -g window-status-activity-style "bg=colour0,fg=colour15"

# Left: session name
set -g status-left "#[fg=colour11,bold] #S #[fg=colour8,nobold] "
set -g status-left-length 20

# Right: time
set -g status-right " #[fg=colour15,bold]%H:%M "
set -g status-right-length 20

# Active window — bright yellow bold with brackets
set-window-option -g window-status-current-format "#[fg=colour11,bold] [#I:#W] #[nobold]"

# Inactive window — dim gray
set-window-option -g window-status-format "#[fg=colour8] #I:#W "

# No separator
set-window-option -g window-status-separator ""

# Activity style
set-window-option -g window-status-activity-style "fg=colour15"

# Pane borders
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour11"

# Messages & command prompt
set -g message-style "fg=colour11,bold"
set -g message-command-style "bg=colour0,fg=colour15"

# Pane number display
set -g display-panes-active-colour "colour11"
set -g display-panes-colour "colour8"

# Clock
set-window-option -g clock-mode-colour colour11
