###########################################################################
############		              TMUX CONFIG FILE	            ###############
###########################################################################

################       GLOBAL OPTIONS & BASICS          ################# {{{

# Undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Prefix: remap from C-b to C-x
unbind C-b
set-option -g prefix C-x
bind-key C-x send-prefix

# Status line location (uncomment if you want it at the top)
# set-option -g status-position top

# Input / keys
set-option -g status-keys vi
set-option -gw mode-keys vi           # vi-style keys in copy-mode
setw -g mode-keys vi                  # (older style, kept for compatibility)

# Escape time (for vim responsiveness inside tmux)
# tmux uses the last value, so this is the effective one:
set-option -g escape-time 1

# Focus events (for nvim checkhealth etc.)
set-option -g focus-events on

# Activity
setw -g monitor-activity on

# Mouse support
set-option -g mouse on

# History
set-option -g history-limit 1000000

##### Modern Truecolor + Undercurl Support (tmux 3.5 + Ghostty) #####
# Best terminal type for tmux 3.3+
set -g default-terminal "tmux-256color"

# Enable full truecolor and modern attribute support
set -as terminal-overrides ',*:RGB'

# Allow passthrough for image protocols (needed for ranger image previews in ghostty)
set -g allow-passthrough on

# Window numbering and search behavior
set-option -g renumber-windows on
set-option -g base-index 1
set-option -g wrap-search on

# Status bar on/off and refresh
set-option -g status on
set-option -g status-interval 5

# LazyGit popup (Prefix + g)
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# Claude Code popup (Prefix + c)
bind -r c display-popup -d '#{pane_current_path}' -w80% -h80% -E 'claude code'

# Generic popup terminal (Prefix + o)
bind -r o display-popup -d '#{pane_current_path}' -w70% -h70% -E "$SHELL"

#}}}

################       PANE / WINDOW NAVIGATION          ################# {{{

##### Window switching (no prefix) #####

# Alt + number = jump to window #
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
bind-key -n M-0 select-window -t 10

# Alt+f: next window
bind-key -n M-f next-window
# Alt+b for previous-window is commented out in original
# bind-key -n M-b previous-window

# Shift+Arrow to switch windows
bind-key -n S-Left  previous-window
bind-key -n S-Right next-window

# Move windows with Ctrl+Shift+Arrow
bind-key -n C-S-Left  swap-window -t -1 \; select-window -t -1
bind-key -n C-S-Right swap-window -t +1 \; select-window -t +1

##### Pane navigation (no prefix: Meta + hjkl / arrows) #####

bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

bind-key -n M-Left  select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up    select-pane -U
bind-key -n M-Down  select-pane -D

##### Smart pane switching (no prefix: Ctrl + hjkl / Backspace) #####

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

is_fzf="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"

bind-key -n C-h       if-shell "$is_vim || $is_fzf" "send-keys C-h"  "select-pane -L"
bind-key -n C-j       if-shell "$is_vim || $is_fzf" "send-keys C-j"  "select-pane -D"
bind-key -n C-k       if-shell "$is_vim || $is_fzf" "send-keys C-k"  "select-pane -U"
bind-key -n C-l       if-shell "$is_vim || $is_fzf" "send-keys C-l"  "select-pane -R"
bind-key -n C-BSpace  if-shell "$is_vim || $is_fzf" "send-keys C-\\" "select-pane -l"

##### Pane selection / info (with prefix) #####

# Display panes overlay
bind-key C-d display-panes

# Toggle pane border status
bind-key C-t set-option -g pane-border-status

# Toggle synchronize-panes
bind-key ^ set-window-option synchronize-panes

# Kill session / window
bind-key X kill-session
bind-key K kill-window

#}}}

################       SPLITS, RESIZE & NEW WINDOWS       ############### {{{

##### Splitting panes (basic) #####

# Default splits
bind-key 3 split-window -h
bind-key 2 split-window -v
unbind '"'
unbind %

##### pwd-aware splits & new windows (with prefix) #####

bind-key C-v split-window -h -c "#{pane_current_path}"
bind-key C-x split-window -v -c "#{pane_current_path}"
bind-key C-b split-window -v -l 10 -c "#{pane_current_path}"
bind-key C-c new-window -c "#{pane_current_path}"
bind-key -n M-n new-window -c "#{pane_current_path}"

##### Pane resizing (with prefix) #####

# Resize by 5 cells
bind-key h resize-pane -L 5
bind-key l resize-pane -R 5
bind-key j resize-pane -D 5
bind-key k resize-pane -U 5

bind-key H resize-pane -L 5
bind-key L resize-pane -R 5
bind-key J resize-pane -D 5
bind-key K resize-pane -U 5

# Alt+hjkl after prefix: fine-grained resize (1 cell)
bind-key M-h resize-pane -L
bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-l resize-pane -R

#}}}

################       COPY / PASTE & MAN HELP            ############### {{{

##### Copy / paste (prefix) #####

# Enter copy-mode
bind-key y copy-mode

# Paste from buffer
bind-key p paste-buffer

##### Copy-mode-vi key table #####

# Visual selection
bind-key -T copy-mode-vi v      send-keys -X begin-selection
bind-key -T copy-mode-vi C-v    send-keys -X rectangle-toggle

# Yank selection to clipboard and exit
bind-key -T copy-mode-vi y      send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind-key -T copy-mode-vi Enter  send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Mouse drag selection → primary selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection primary"

# Cancel selection / copy-mode
bind-key -T copy-mode-vi Escape send-keys -X cancel

##### Man-page split (prefix) #####

# Prompt for a man page and open in horizontal split
bind-key C-m command-prompt "split-window -h 'man %%'"

#}}}

################       RENAME & MISC COMMANDS             ############### {{{

##### Reload config #####

bind-key r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

##### Rename session / window / pane #####

bind-key M-S command-prompt -p "Rename session:" -I '#S' 'rename-session %1'
bind-key M-W command-prompt -p "Rename window:"  -I '#W' 'rename-window %1'
bind-key M-P command-prompt -p "Rename pane:"    -I '#T' 'rename-pane %1'

bind-key $ command-prompt -p "Rename session:" -I '#S' 'rename-session %1'
bind-key , command-prompt -p "Rename window:"  -I '#W' 'rename-window %1'

##### Toggle status bar (prefix + C-s) #####

bind-key C-s set-option status

#}}}

###############  STATUSBAR / THEME (GRUVBOX DARK)        ############### {{{

# COLORSCHEME: gruvbox dark
set-option -g status "on"

# Base status colors
set-option -g status-bg colour237   # bg1
set-option -g status-fg colour223   # fg1

# Default window title colors
set-option -g window-status-style          bg=colour246,fg=colour237
set-option -g window-status-activity-style bg=colour237,fg=colour248

# Active window title colors
set-option -g window-status-current-style bg=default,fg=colour237

# Pane borders
set-option -g pane-active-border-style fg=colour241
set-option -g pane-border-style        fg=colour241

# Messages
set-option -g message-style         bg=colour239,fg=colour223
set-option -g message-command-style bg=black,fg=colour223

# Pane number display colors
set-option -g display-panes-active-colour colour250
set-option -g display-panes-colour        colour237

# Clock
set-window-option -g clock-mode-colour colour246
set-window-option -g clock-mode-style 12

# Bell
set-window-option -g window-status-bell-style fg=colour235,bg=colour167

# Status formatting & justification
set-option -g status-justify      "left"
set-option -g status-left-length  "80"
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

##### Powerline-style status line #####

# Left: session name
set-option -g status-left "#[fg=colour246, bg=colour239] #S #[fg=colour239, bg=colour237, nobold, noitalics, nounderscore]"

# Right: flags + short dir + user@host
# set-option -g status-right "#{?pane_dead,dead ,}#{?window_zoomed_flag,zoom ,}#{?pane_synchronized,sync ,}#[fg=colour239, bg=colour237, nobold, nounderscore, noitalics]#[fg=colour246, bg=colour239] #(show-short-dir \"#{pane_current_path}\" \"#{client_width}\") #[fg=colour246, bg=colour239, nobold, noitalics, nounderscore]#[fg=colour235, bg=colour246] $USER@#h "
set-option -g status-right ""

# Powerline window status formats (with arrows)
set-window-option -g window-status-current-format "#[fg=colour237, bg=colour246, nobold, noitalics, nounderscore]#[fg=colour235, bg=colour246] #I #[fg=colour235, bg=colour246, bold] #W #[fg=colour246, bg=colour237, nobold, noitalics, nounderscore]"
set-window-option -g window-status-format         "#[fg=colour237, bg=colour239, nobold, noitalics, nounderscore]#[fg=colour246,bg=colour239] #I #[fg=colour246, bg=colour239] #W #[fg=colour239, bg=colour237, noitalics]"

#}}}

################       TTY OVERRIDES (VIRTUAL CONSOLE)    ############### {{{

# When attached from a TTY (TERM=linux), override powerline glyphs
# and 256-color references with ASCII-only, 16-color gruvbox theme
if-shell -F '#{==:#{client_termname},linux}' 'source-file ~/.tmux/tty.conf'

# Re-apply on every client attach (handles tmux-resurrect/continuum restores)
# TTY client → apply tty.conf overrides
# GUI client → re-source main config to restore powerline/mouse/256color
set-hook -g client-attached 'if-shell -F "#{==:#{client_termname},linux}" "source-file ~/.tmux/tty.conf" "source-file ~/.tmux.conf"'

#}}}

##############  PLUGINS (TPM)  ########################## {{{

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'NHDaly/tmux-better-mouse-mode'

# Session persistence — auto-save every 10 min, auto-restore on tmux start
set -g @continuum-save-interval '10'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-processes '"claude-tmux->claude-tmux --restore"'

set-option -g @scroll-down-exit-copy-mode                   'on'
set-option -g @scroll-without-changing-pane                 'on'
set-option -g @scroll-in-moused-over-pane                   'on'
set-option -g @scroll-speed-num-lines-per-scroll            '1'
set-option -g @emulate-scroll-for-no-mouse-alternate-buffer 'on'

# Install `tpm` if needed.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Activate the plugins (keep at bottom)
run -b "~/.tmux/plugins/tpm/tpm"

#}}}
